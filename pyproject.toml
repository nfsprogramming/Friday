[project]
name = "friday-tony-stark-demo"
version = "0.1.0"
description = "Friday — A Tony Stark-inspired MCP server"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "nfsprogramming", email = "mohammed.nifras.000555@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.11.2",
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "duckduckgo-search>=8.1.1",
    "easyocr>=1.7.2",
    "fastapi>=0.136.3",
    "faster-whisper>=1.2.1",
    "fastmcp",
    "httpx",
    "livekit-agents[deepgram,groq,openai,sarvam,silero]>=1.5.1",
    "livekit-api>=1.1.0",
    "livekit-plugins-google>=1.5.1",
    "lxml>=6.1.1",
    "mss>=10.2.0",
    "numpy>=2.4.4",
    "openai-whisper>=20250625",
    "opencv-python>=4.13.0.92",
    "openwakeword>=0.6.0",
    "piper-tts>=1.4.2",
    "playwright>=1.60.0",
    "psutil>=7.2.2",
    "pyaudio>=0.2.14",
    "python-dotenv",
    "requests>=2.33.1",
    "sentence-transformers>=5.5.1",
    "sounddevice>=0.5.5",
    "soundfile>=0.14.0",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.44.0",
    "webrtcvad>=2.0.10",
]

[project.scripts]
friday = "mcp_server:main"
friday_voice = "livekit_agent:dev" # Points to the wrapper

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server.py"]
